  <rect width="32" height="32" rx="6" fill="#13151a"/>
  <!-- slide / projector screen -->
  <rect x="5" y="6.5" width="22" height="15" rx="2" fill="#1c1f27" stroke="#7c9cff" stroke-width="1.6"/>
  <!-- centered lyric lines on the slide -->
  <rect x="9"  y="11" width="14" height="2" rx="1" fill="#7c9cff"/>
  <rect x="11" y="15" width="10" height="2" rx="1" fill="#e7e9ee"/>
  <!-- screen stand -->
  <rect x="15" y="21.5" width="2" height="3" fill="#9aa1b1"/>
  <rect x="11" y="24.5" width="10" height="2" rx="1" fill="#9aa1b1"/>
</svg>
